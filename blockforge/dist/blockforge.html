<!doctype html>
<html lang="en">

<style>/* Blockforge interface. Layout: full-bleed canvas with HUD and menus layered
   on top; one unit (--u) scales every interface measurement. */
:root {
  --u: 2px;
  --panel: rgba(14, 18, 24, 0.93);
  --panel-2: rgba(28, 34, 44, 0.96);
  --edge: #2e3847;
  --edge-hi: #4a5a70;
  --ink: #edf1f5;
  --muted: #9aa7b6;
  --accent: #f2b33a;
  --accent-deep: #b9761c;
  --danger: #e25b4c;
  --slot: rgba(6, 9, 13, 0.55);
  --font-ui: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  --font-logo: 'Silkscreen', 'Pixelify Sans', 'Courier New', monospace;
  --font-mono: 'VT323', 'Consolas', 'Courier New', monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e12; color: var(--ink); }
body { font-family: var(--font-ui); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: none; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; overflow: hidden; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; cursor: default; }

/* Full-screen overlays */
.overlay { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.15s linear; }
#overlay-water { background: radial-gradient(ellipse at center, rgba(20, 60, 140, 0.18), rgba(8, 24, 70, 0.55)); }
#overlay-lava { background: rgba(200, 60, 10, 0.55); }
#overlay-hurt { background: radial-gradient(ellipse at center, rgba(160, 0, 0, 0) 40%, rgba(170, 0, 0, 0.9)); transition: none; }
#overlay-fire { background: linear-gradient(to top, rgba(255, 120, 20, 0.55), rgba(255, 180, 60, 0.12) 35%, transparent 55%); animation: flick 0.2s steps(2) infinite; }
@keyframes flick { 50% { filter: brightness(1.2); } }
#overlay-portal { background: radial-gradient(ellipse at center, rgba(90, 170, 255, 0.3), rgba(40, 20, 130, 0.85)); transition: none; }
#overlay-sleep { background: #04060a; transition: none; }
#overlay-flash { background: rgba(230, 236, 255, 0.5); transition: none; }
#sleep-ui { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 40 * var(--u)); transform: translateX(-50%); z-index: 20; }
#toasts { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 4 * var(--u)); top: calc(env(safe-area-inset-top, 0px) + 4 * var(--u)); display: flex; flex-direction: column; gap: calc(3 * var(--u)); pointer-events: none; z-index: 40; }
.toast { width: calc(150 * var(--u)); max-width: calc(100vw - 32px); background: var(--panel); border: var(--u) solid #06080b; box-shadow: inset 0 0 0 var(--u) var(--accent-deep), 0 calc(2 * var(--u)) calc(8 * var(--u)) rgba(0, 0, 0, 0.5); padding: calc(3 * var(--u)) calc(5 * var(--u)); animation: toastin 5s ease-in-out forwards; }
.toast small { display: block; color: var(--accent); font-size: calc(6.5 * var(--u)); }
.toast b { display: block; font-size: calc(8 * var(--u)); font-weight: 600; }
.toast span { display: block; color: var(--muted); font-size: calc(6.5 * var(--u)); }
@keyframes toastin { 0% { transform: translateX(120%); } 8%, 88% { transform: translateX(0); } 100% { transform: translateX(120%); } }
#gadget { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 4 * var(--u)); bottom: calc(env(safe-area-inset-bottom, 0px) + 4 * var(--u)); font-size: calc(7.5 * var(--u)); background: rgba(8, 10, 14, 0.6); border: var(--u) solid rgba(0, 0, 0, 0.7); padding: calc(1.5 * var(--u)) calc(3 * var(--u)); text-shadow: calc(0.6 * var(--u)) calc(0.6 * var(--u)) 0 #000; display: flex; align-items: center; gap: calc(3 * var(--u)); }
#gadget .needle { display: inline-block; width: calc(9 * var(--u)); height: calc(9 * var(--u)); border-radius: 50%; border: var(--u) solid #9aa7b6; position: relative; }
#gadget .needle::after { content: ''; position: absolute; left: calc(50% - var(--u) / 2); top: 5%; width: var(--u); height: 45%; background: #e2413a; transform-origin: 50% 100%; transform: rotate(var(--a, 0deg)); }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.28)); }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#crosshair { position: absolute; left: 50%; top: 50%; width: calc(9 * var(--u)); height: calc(9 * var(--u)); transform: translate(-50%, -50%); mix-blend-mode: difference; }
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; }
#crosshair::before { left: 0; right: 0; top: calc(50% - var(--u) / 2); height: var(--u); }
#crosshair::after { top: 0; bottom: 0; left: calc(50% - var(--u) / 2); width: var(--u); }

#status { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 3 * var(--u)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: calc(2 * var(--u)); }
#bars, #row-top { width: calc(182 * var(--u)); display: flex; justify-content: space-between; align-items: flex-end; }
#row-top:empty, #row-top:has(> [hidden]:first-child + [hidden]) { display: none; }
#hearts, #food, #air, #armor { display: flex; gap: 0; }
#hearts img, #food img, #air img, #armor img { width: calc(9 * var(--u)); height: calc(9 * var(--u)); image-rendering: pixelated; display: block; margin-right: calc(-1 * var(--u)); }
#air { margin-left: auto; }
#air img { margin: 0 0 0 calc(-1 * var(--u)); }
#absorb { display: flex; gap: 0; }
#absorb img { width: calc(9 * var(--u)); height: calc(9 * var(--u)); image-rendering: pixelated; display: block; margin-right: calc(-1 * var(--u)); }
#effects { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 4 * var(--u)); top: calc(env(safe-area-inset-top, 0px) + 4 * var(--u)); display: flex; flex-direction: column; gap: calc(2 * var(--u)); pointer-events: none; }
#effects .fx { display: flex; align-items: center; gap: calc(3 * var(--u)); background: rgba(8, 10, 14, 0.62); border: var(--u) solid rgba(0, 0, 0, 0.7); padding: calc(1.5 * var(--u)) calc(3 * var(--u)); font-size: calc(7 * var(--u)); text-shadow: calc(0.6 * var(--u)) calc(0.6 * var(--u)) 0 #000; }
#effects .fx i { width: calc(7 * var(--u)); height: calc(7 * var(--u)); border-radius: 50%; box-shadow: inset 0 0 0 var(--u) rgba(0, 0, 0, 0.5), 0 0 calc(3 * var(--u)) currentColor; }
#effects .fx b { color: var(--muted); font-weight: 400; margin-left: auto; padding-left: calc(3 * var(--u)); font-variant-numeric: tabular-nums; }
#effects .fx.blink { opacity: 0.55; }
#bossbar { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 6 * var(--u)); transform: translateX(-50%); width: min(calc(182 * var(--u)), 80vw); text-align: center; pointer-events: none; }
#bossbar b { display: block; font-size: calc(8 * var(--u)); font-weight: 600; text-shadow: var(--u) var(--u) 0 #000; margin-bottom: calc(1.5 * var(--u)); color: #e8d8ff; }
#bossbar .bar { height: calc(5 * var(--u)); background: #120a1c; border: var(--u) solid #000; }
#bossbar .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(#e0a0ff, #9a40e0 60%, #5a1a90); transition: width 0.2s; }
#map-panel { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 6 * var(--u)); bottom: calc(env(safe-area-inset-bottom, 0px) + 50 * var(--u)); width: min(calc(128 * var(--u)), 38vw); aspect-ratio: 1; padding: calc(5 * var(--u)); background: #d8c8a0; border: var(--u) solid #6a5030; box-shadow: inset 0 0 0 calc(2 * var(--u)) #b09a70, 0 calc(2 * var(--u)) calc(8 * var(--u)) rgba(0, 0, 0, 0.45); pointer-events: none; }
#map-panel canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
#map-panel .markers { position: absolute; inset: calc(5 * var(--u)); }
#map-panel .mk { position: absolute; width: calc(6 * var(--u)); height: calc(8 * var(--u)); background: #3a7aff; clip-path: polygon(50% 0, 100% 100%, 50% 75%, 0 100%); }
#map-panel .mk.me { background: #ffffff; filter: drop-shadow(0 0 var(--u) #000); }
.brew { display: flex; align-items: center; gap: calc(10 * var(--u)); }
.bfuel { display: flex; flex-direction: column; align-items: center; gap: calc(2 * var(--u)); }
.fuelbar { width: calc(18 * var(--u)); height: calc(4 * var(--u)); background: #1c1410; border: var(--u) solid #000; }
.fuelbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff9a30, #ffd060); }
.bmid { display: flex; flex-direction: column; align-items: center; gap: calc(2 * var(--u)); }
.brewprog { width: calc(6 * var(--u)); height: calc(18 * var(--u)); background: #2a3040; position: relative; clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%); }
.brewprog i { position: absolute; left: 0; right: 0; top: 0; height: 0; background: #f4f4f4; }
.bottles { display: flex; gap: calc(6 * var(--u)); }
.slot.bottle-slot:not(:has(img[src]))::before { content: ''; position: absolute; inset: 25% 32%; opacity: 0.2; background: #cdd6e0; clip-path: polygon(35% 0, 65% 0, 65% 35%, 100% 55%, 100% 100%, 0 100%, 0 55%, 35% 35%); }
.menu.sign { background: var(--panel); border: var(--u) solid var(--edge); padding: calc(8 * var(--u)); }
.sign-edit { display: flex; flex-direction: column; gap: calc(2 * var(--u)); width: 100%; padding: calc(6 * var(--u)); background: #a4804e; border: calc(2 * var(--u)) solid #6a4a26; }
.sign-edit input { font: inherit; font-size: calc(9 * var(--u)); text-align: center; color: #241408; background: rgba(255, 255, 255, 0.15); border: none; padding: calc(1.5 * var(--u)); outline: none; user-select: text; }
.sign-edit input:focus { background: rgba(255, 255, 255, 0.3); }
.menu.epilogue-menu { background: rgba(8, 4, 16, 0.92); border: var(--u) solid #3b2a6b; padding: calc(10 * var(--u)); width: min(100%, calc(280 * var(--u))); }
.epilogue p { font-size: calc(8 * var(--u)) !important; line-height: 1.5; color: #e8dcff; margin-bottom: calc(4 * var(--u)) !important; }
#tooltip small.good { color: #8ab8ff; }
#tooltip small.bad { color: #ff8a8a; }
#xp { position: relative; width: calc(182 * var(--u)); height: calc(5 * var(--u)); background: #10150c; border: var(--u) solid #000; margin-top: calc(-1 * var(--u)); }
#xp i { display: block; height: 100%; width: 0; background: linear-gradient(#b8ff5a, #62c21c 60%, #3f8a0e); }
#xp b { position: absolute; left: 50%; bottom: calc(1 * var(--u)); transform: translateX(-50%); font-size: calc(8.5 * var(--u)); font-weight: 700; color: #9cff4a; text-shadow: calc(0.7 * var(--u)) 0 0 #000, calc(-0.7 * var(--u)) 0 0 #000, 0 calc(0.7 * var(--u)) 0 #000, 0 calc(-0.7 * var(--u)) 0 #000; font-variant-numeric: tabular-nums; }
#xp b:empty { display: none; }

#hotbar { position: relative; display: flex; padding: calc(1 * var(--u)); background: rgba(8, 10, 14, 0.62); border: var(--u) solid rgba(0, 0, 0, 0.7); box-shadow: inset 0 0 0 var(--u) rgba(255, 255, 255, 0.07); }
#hotbar .slot { width: calc(20 * var(--u)); height: calc(20 * var(--u)); background: transparent; border: none; box-shadow: inset 0 0 0 var(--u) rgba(255, 255, 255, 0.06), inset 0 0 0 calc(2 * var(--u)) rgba(0, 0, 0, 0.35); }
.hot-sel { position: absolute; top: calc(-1 * var(--u)); left: calc(var(--i) * 20 * var(--u)); width: calc(24 * var(--u)); height: calc(24 * var(--u)); border: calc(2 * var(--u)) solid var(--accent); box-shadow: 0 0 0 var(--u) #000, inset 0 0 0 var(--u) rgba(0, 0, 0, 0.6); transition: left 0.05s linear; }
#item-name { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 50 * var(--u)); transform: translateX(-50%); font-size: calc(9 * var(--u)); text-shadow: var(--u) var(--u) 0 #000; opacity: 0; white-space: nowrap; }
#item-name.fade { animation: namefade 2.6s ease-out forwards; }
@keyframes namefade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

#debug { position: absolute; inset: 0; font-family: var(--font-mono); font-size: calc(9 * var(--u)); line-height: 1.05; display: flex; justify-content: space-between; padding: calc(2 * var(--u)); pointer-events: none; }
#debug .dl, #debug .dr { display: flex; flex-direction: column; gap: calc(0.5 * var(--u)); }
#debug .dr { align-items: flex-end; text-align: right; }
#debug span { background: rgba(10, 12, 16, 0.55); padding: 0 calc(1.5 * var(--u)); width: fit-content; min-height: 1em; }
#debug span:empty { background: none; }

#chat { position: absolute; left: calc(2 * var(--u)); bottom: calc(env(safe-area-inset-bottom, 0px) + 44 * var(--u)); width: min(calc(320 * var(--u)), 70vw); font-size: calc(8 * var(--u)); pointer-events: none; }
#chat-log div { background: rgba(0, 0, 0, 0.45); padding: calc(0.5 * var(--u)) calc(2 * var(--u)); text-shadow: calc(0.5 * var(--u)) calc(0.5 * var(--u)) 0 #000; overflow-wrap: anywhere; }
#chat-input { pointer-events: auto; width: 100%; margin-top: calc(1 * var(--u)); font: inherit; font-size: calc(8 * var(--u)); color: var(--ink); background: rgba(0, 0, 0, 0.7); border: var(--u) solid var(--edge-hi); padding: calc(1.5 * var(--u)) calc(2 * var(--u)); outline: none; }

#click-to-play { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); padding: calc(3 * var(--u)) calc(8 * var(--u)); font-size: calc(9 * var(--u)); background: var(--panel); border: var(--u) solid var(--edge-hi); pointer-events: none; }

/* Slots */
.slot { position: relative; width: calc(18 * var(--u)); height: calc(18 * var(--u)); background: var(--slot); border: var(--u) solid #06080b; box-shadow: inset var(--u) var(--u) 0 rgba(0, 0, 0, 0.5), inset calc(-1 * var(--u)) calc(-1 * var(--u)) 0 rgba(255, 255, 255, 0.07); display: flex; align-items: center; justify-content: center; }
.slot img { width: 80%; height: 80%; image-rendering: pixelated; pointer-events: none; }
.slot .count { position: absolute; right: calc(0.5 * var(--u)); bottom: calc(-0.5 * var(--u)); font-size: calc(8 * var(--u)); font-weight: 600; text-shadow: calc(0.6 * var(--u)) calc(0.6 * var(--u)) 0 #000; pointer-events: none; font-variant-numeric: tabular-nums; }
.slot .dur { position: absolute; left: 12%; right: 12%; bottom: 10%; height: calc(1.5 * var(--u)); background: #000; display: none; pointer-events: none; }
.slot .dur i { display: block; height: 100%; }
.panel .slot:hover, .panel .slot.drag { background: rgba(255, 255, 255, 0.16); }
.slot.result { width: calc(26 * var(--u)); height: calc(26 * var(--u)); }
.slot.ench img { animation: glint 3s linear infinite; }
@keyframes glint { 0%, 100% { filter: drop-shadow(0 0 calc(0.8 * var(--u)) rgba(190, 120, 255, 0.9)) brightness(1.1); } 50% { filter: drop-shadow(0 0 calc(1.6 * var(--u)) rgba(150, 90, 255, 1)) brightness(1.35) hue-rotate(20deg); } }
.armor-slot:not(:has(img[src]))::before { content: ''; position: absolute; inset: 22%; opacity: 0.22; background: #cdd6e0; }
.a-head:not(:has(img[src]))::before { clip-path: polygon(10% 30%, 50% 5%, 90% 30%, 90% 80%, 70% 80%, 70% 50%, 30% 50%, 30% 80%, 10% 80%); }
.a-chest:not(:has(img[src]))::before { clip-path: polygon(0 10%, 35% 0, 50% 12%, 65% 0, 100% 10%, 100% 40%, 80% 40%, 80% 100%, 20% 100%, 20% 40%, 0 40%); }
.a-legs:not(:has(img[src]))::before { clip-path: polygon(15% 0, 85% 0, 85% 100%, 58% 100%, 50% 35%, 42% 100%, 15% 100%); }
.a-feet:not(:has(img[src]))::before { clip-path: polygon(20% 0, 55% 0, 55% 60%, 95% 60%, 95% 100%, 20% 100%); }
.grid.armor { align-self: center; }
.slot.trash span { font-size: calc(10 * var(--u)); color: var(--danger); }

#cursor-item { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 50; }
#cursor-item .slot { background: none; border: none; box-shadow: none; transform: translate(-50%, -50%); width: calc(18 * var(--u)); height: calc(18 * var(--u)); }
#tooltip { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; background: rgba(12, 8, 22, 0.94); border: var(--u) solid #3b2a6b; padding: calc(1.5 * var(--u)) calc(3 * var(--u)); font-size: calc(8 * var(--u)); line-height: 1.25; white-space: nowrap; }
#tooltip small { color: var(--muted); font-size: calc(7 * var(--u)); }
#tooltip .en { color: #7fe6ff; }
#tooltip small.el { color: #c6a6ff; }

/* Menus */
#screens { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.menu { width: min(100%, calc(230 * var(--u))); display: flex; flex-direction: column; align-items: center; gap: calc(5 * var(--u)); text-align: center; }
.menu h1, .menu h2 { margin: 0; font-weight: 600; text-shadow: var(--u) var(--u) 0 #000; text-wrap: balance; }
.menu h2 { font-size: calc(11 * var(--u)); }
.menu p { margin: 0; font-size: calc(7.5 * var(--u)); text-shadow: calc(0.6 * var(--u)) calc(0.6 * var(--u)) 0 #000; max-width: 60ch; }
.menu .muted { color: var(--muted); }
.menu .warn { color: #f5c96b; }
.menu.pause, .menu.options, .menu.controls, .menu.worlds, .menu.create, .menu.death, .menu.loading { background: var(--panel); border: var(--u) solid var(--edge); padding: calc(8 * var(--u)); box-shadow: 0 calc(4 * var(--u)) calc(20 * var(--u)) rgba(0, 0, 0, 0.5); }
#screens:has(.title), #screens:has(.pause), #screens:has(.options), #screens:has(.controls), #screens:has(.death) { background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.55)); }
#screens:has(.death) { background: rgba(120, 10, 10, 0.4); }
#screens:has(.loading) { background: #0e1217; }
.buttons { display: flex; flex-direction: column; gap: calc(3 * var(--u)); width: 100%; }
.row { display: flex; gap: calc(3 * var(--u)); width: 100%; flex-wrap: wrap; }
.row .btn { flex: 1 1 0; min-width: calc(80 * var(--u)); }
.btn { font: inherit; font-size: calc(8 * var(--u)); color: var(--ink); background: linear-gradient(#3a4556, #2a3341); border: var(--u) solid #0a0d11; box-shadow: inset 0 var(--u) 0 rgba(255, 255, 255, 0.18), inset 0 calc(-2 * var(--u)) 0 rgba(0, 0, 0, 0.35); padding: calc(3.5 * var(--u)) calc(6 * var(--u)); cursor: pointer; text-shadow: calc(0.6 * var(--u)) calc(0.6 * var(--u)) 0 #000; }
.btn:hover:not(:disabled), .btn:focus-visible { outline: none; border-color: var(--accent); color: #fff4d8; }
.btn:active:not(:disabled) { transform: translateY(var(--u)); box-shadow: inset 0 var(--u) 0 rgba(255, 255, 255, 0.1); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.wide { width: 100%; }
.btn.sel { border-color: var(--accent); background: linear-gradient(#5a4a2c, #3d311d); }
.btn.danger { background: linear-gradient(#7a3a33, #5a2822); }

.title { width: min(100%, calc(260 * var(--u))); }
.logo { font-family: var(--font-logo); font-weight: 700; font-size: calc(30 * var(--u)); line-height: 0.95; display: flex; flex-wrap: wrap; justify-content: center; letter-spacing: calc(1 * var(--u)); }
.logo span { background: linear-gradient(#ffe7a6 0%, var(--accent) 45%, var(--accent-deep) 55%, #7c4a10 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(calc(1.5 * var(--u)) calc(1.5 * var(--u)) 0 #1c0f02) drop-shadow(0 0 calc(1 * var(--u)) #000); }
.logo span + span { background: linear-gradient(#e8eef6 0%, #a9b7c8 45%, #6f7f94 55%, #3f4a59 100%); -webkit-background-clip: text; background-clip: text; }
.tagline { color: #f7e2b0; font-size: calc(8 * var(--u)) !important; margin-bottom: calc(6 * var(--u)) !important; }
.foot { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); color: rgba(255, 255, 255, 0.72); font-size: calc(6 * var(--u)) !important; max-width: none !important; }
.dead { font-size: calc(18 * var(--u)); color: #ff6b5e; }

.world-list { width: 100%; max-height: min(50vh, calc(140 * var(--u))); overflow: auto; display: flex; flex-direction: column; gap: calc(2 * var(--u)); background: rgba(0, 0, 0, 0.35); border: var(--u) solid var(--edge); padding: calc(2 * var(--u)); }
.world { font: inherit; color: var(--ink); background: transparent; border: var(--u) solid transparent; display: flex; flex-direction: column; align-items: flex-start; gap: calc(1 * var(--u)); padding: calc(2.5 * var(--u)) calc(4 * var(--u)); cursor: pointer; text-align: left; }
.world b { font-size: calc(8.5 * var(--u)); font-weight: 600; }
