<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Blockforge</title>
<meta name="description" content="Blockforge: an open-world voxel sandbox in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<!--APP-->
<div id="app">
  <canvas id="game" tabindex="0" aria-label="Game view"></canvas>
  <div id="vignette"></div>
  <div id="overlay-water" class="overlay"></div>
  <div id="overlay-lava" class="overlay"></div>
  <div id="overlay-fire" class="overlay"></div>
  <div id="overlay-hurt" class="overlay"></div>
  <div id="overlay-portal" class="overlay"></div>
  <div id="overlay-sleep" class="overlay"></div>
  <div id="overlay-flash" class="overlay"></div>
  <div id="hud" hidden>
    <div id="crosshair"></div>
    <div id="debug" hidden></div>
    <div id="item-name"></div>
    <div id="gadget" hidden></div>
    <div id="effects" hidden></div>
    <div id="ammo" hidden><i></i><span></span></div>
    <div id="bossbar" hidden><b></b><div class="bar"><i></i></div></div>
    <div id="map-panel" hidden><canvas width="128" height="128"></canvas><div class="markers"></div></div>
    <div id="status">
      <div id="row-top"><div id="absorb"></div><div id="armor"></div><div id="air"></div></div>
      <div id="bars"><div id="hearts"></div><div id="food"></div></div>
      <div id="xp"><i></i><b></b></div>
      <div id="hotbar"></div>
    </div>
  </div>
  <div id="chat"><div id="chat-log"></div><input id="chat-input" hidden maxlength="256" autocomplete="off" spellcheck="false" aria-label="Chat"></div>
  <div id="click-to-play" hidden>Click to play</div>
  <div id="sleep-ui" hidden><button class="btn" id="b-wake">Leave Bed</button></div>
  <div id="toasts"></div>
  <div id="screens" hidden></div>
  <div id="cursor-item" hidden></div>
  <div id="tooltip" hidden></div>
</div>
<!--/APP-->
<script type="module" src="src/main.js"></script>
</body>
</html>
